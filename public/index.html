<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdForge — AI Ad Maker</title>
<meta name="description" content="AdForge: generate complete ads — copy and banner image together — for Amazon, Shopify, Facebook/Instagram, Google Ads and more.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="rack" id="rack">
  <div class="rack-head">
    <img class="brand-mark" src="logo.svg" alt="AdForge">
    <div class="rack-sub">AI Ad Maker</div>
  </div>
  <nav class="pegboard" id="pegboard"></nav>
</div>

<main class="bay">
  <button class="hamburger" id="hamburger" aria-label="Open platforms">☰</button>

  <header class="topbar">
    <h1 id="toolTitle">Amazon Listing</h1>
    <p class="topbar-sub" id="toolSub">Describe your product</p>
  </header>

  <div class="log-scroll" id="logScroll">
    <div class="examples" id="examples"></div>
    <div class="chat-log" id="chatLog"></div>
  </div>

  <div class="composer-dock">
    <form id="toolForm" class="composer">
      <textarea id="toolInput" rows="1" placeholder="Type here..." required></textarea>
      <button type="submit" class="run-btn" id="runBtn" aria-label="Generate ad">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>
    <div class="status" id="status"></div>
  </div>
</main>

<div class="scrim" id="scrim"></div>

<script src="app.js"></script>
</body>
</html>
